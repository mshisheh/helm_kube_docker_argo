name: Test, build, and promote

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-promotion-${{ github.ref }}
  cancel-in-progress: false

env:
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  IMAGE_NAME: ml-api

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out application source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check committed model can be reproduced
        run: |
          cp model/iris.json /tmp/committed-model.json
          python scripts/train_model.py
          diff --unified /tmp/committed-model.json model/iris.json

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  build-and-promote:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out application source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Build and push immutable image
        env:
          IMAGE: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Check out deployment repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DEPLOYMENT_REPOSITORY }}
          token: ${{ secrets.DEPLOYMENT_REPOSITORY_TOKEN }}
          path: deployment

      - name: Update production image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          values = Path('deployment/environments/prod-values.yaml')
          content = values.read_text()
          updated, count = re.subn(
              r'(?m)^(  tag: ).+$',
              rf'\g<1>"{os.environ["IMAGE_TAG"]}"',
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected exactly one image tag in {values}; found {count}')
          values.write_text(updated)
          PY

      - name: Commit GitOps promotion
        working-directory: deployment
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add environments/prod-values.yaml
          if git diff --cached --quiet; then
            echo "Image tag ${IMAGE_TAG} is already promoted."
            exit 0
          fi
          git commit -m "chore(prod): deploy ${IMAGE_TAG}"
          git push
