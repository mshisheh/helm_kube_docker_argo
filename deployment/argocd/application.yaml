apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ml-api-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_ORG/ml-platform-deploy.git
    targetRevision: main
    path: charts/ml-api
    helm:
      valueFiles:
        - ../../environments/prod-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ml-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
